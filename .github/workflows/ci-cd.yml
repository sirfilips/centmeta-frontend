name: Frontend CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build & Typecheck (Cloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  deploy:
    name: Deploy to Production (Debian Runner)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Pull, build and reload service
        run: |
          echo "[Deploy] Navigazione nella directory frontend..."
          cd /home/CenturionREC/frontend
          
          echo "[Deploy] Git pull da main..."
          git pull --ff-only origin main
          
          echo "[Deploy] Installazione dipendenze esatte..."
          npm ci
          
          echo "[Deploy] Compilazione Next.js di produzione..."
          npm run build
          
          echo "[Deploy] Riavvio servizio CentMeta (centurionrec)..."
          if command -v sudo >/dev/null 2>&1; then
            sudo systemctl restart centurionrec.service
          else
            systemctl restart centurionrec.service
          fi
          
          echo "[Deploy] Deploy frontend completato con successo!"

