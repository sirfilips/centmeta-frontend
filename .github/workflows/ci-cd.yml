name: Frontend CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build & Typecheck (Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  deploy:
    name: Deploy to Production (Debian Runner)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production
    steps:
      - name: Pull, build and reload service
        run: |
          set -euo pipefail
          echo "[Deploy] Acquisizione lock esclusivo (timeout 300s)..."
          exec 200>/tmp/centmeta_deploy.lock
          flock -w 300 200

          echo "[Deploy] Navigazione nella directory frontend..."
          cd /home/CenturionREC/frontend

          SUDO=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi

          restart_and_verify() {
            $SUDO systemctl restart centurionrec.service
            $SUDO systemctl is-active --quiet centurionrec.service || return 1
            local i
            for i in $(seq 1 15); do
              if curl -fsS --max-time 2 http://127.0.0.1:8000/api/health >/dev/null 2>&1 && \
                 curl -fsS --max-time 2 http://127.0.0.1:3000/ >/dev/null 2>&1; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          rollback_frontend() {
            echo "[Deploy] ERRORE: avvio rollback automatico..." >&2
            $SUDO journalctl -u centurionrec.service -n 40 --no-pager || true
            if [[ "$PREV_SHA" != "$NEW_SHA" ]]; then
              git reset --hard "$PREV_SHA"
              if [[ "$DEPS_CHANGED" -eq 1 ]]; then
                npm ci || true
              fi
            fi
            if [[ -d .next.bak ]]; then
              rm -rf .next
              mv .next.bak .next
            fi
            $SUDO systemctl restart centurionrec.service || true
            exit 1
          }

          echo "[Deploy] Reset modifiche locali ai file tracciati..."
          git checkout -- .

          PREV_SHA=$(git rev-parse HEAD)
          echo "[Deploy] Git pull da main..."
          git pull --ff-only origin main
          NEW_SHA=$(git rev-parse HEAD)

          if [[ ! -f .env.local && ! -f .env.production && -f /home/CenturionREC/.env ]]; then
            echo "[Deploy] Caricamento variabili NEXT_PUBLIC_* da /home/CenturionREC/.env per la build..."
            while IFS='=' read -r k v || [[ -n "${k:-}" ]]; do
              [[ "$k" =~ ^NEXT_PUBLIC_[A-Za-z0-9_]+$ ]] || continue
              v="${v%$'\r'}"
              v="${v#\"}"; v="${v%\"}"
              v="${v#\'}"; v="${v%\'}"
              export "$k=$v"
            done < /home/CenturionREC/.env
          fi

          DEPS_CHANGED=0
          if [[ ! -d node_modules ]] || [[ "$PREV_SHA" == "$NEW_SHA" ]] || ! git diff --quiet "$PREV_SHA" "$NEW_SHA" -- package-lock.json; then
            DEPS_CHANGED=1
            echo "[Deploy] Installazione dipendenze esatte..."
            npm ci
          else
            echo "[Deploy] package-lock.json invariato, skip npm ci."
          fi

          rm -rf .next.bak
          if [[ -d .next ]]; then
            cp -a .next .next.bak
          fi

          echo "[Deploy] Compilazione Next.js di produzione..."
          if ! NEXT_TELEMETRY_DISABLED=1 npm run build; then
            rollback_frontend
          fi

          echo "[Deploy] Riavvio servizio CentMeta e verifica HTTP..."
          if ! restart_and_verify; then
            rollback_frontend
          fi

          rm -rf .next.bak
          echo "[Deploy] Deploy frontend completato con successo!"
